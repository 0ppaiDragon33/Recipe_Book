<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Culinary Cookbook — a secure Flutter recipe book app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Culinary Cookbook">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Security headers via meta (belt-and-suspenders; real CSP goes in netlify.toml) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  <link rel="shortcut icon" type="image/png" href="icons/Icon-192.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Culinary Cookbook</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #FAF7F2; font-family: Georgia, serif; }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #E85D26;
      gap: 16px;
    }
    #loading h1 { font-size: 2rem; font-weight: 700; }
    #loading p  { color: #888; font-size: 0.9rem; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid #EEE;
      border-top: 3px solid #E85D26;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>Culinary Cookbook</h1>
    <p>Loading your recipes…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
